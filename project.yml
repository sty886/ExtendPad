name: ExtendPad
options:
  createIntermediateGroups: true
# Swift Package Manager dependencies. Sparkle is retained for a future,
# independently signed ExtendPad feed, but is stopped and has no feed URL or
# public key until that feed exists. Never point it at an upstream appcast.
packages:
  # Exact versions, so a clean checkout builds against the same libraries the
  # release candidate was tested with (the resolved file lives in the
  # generated, untracked project). Raise them deliberately, then re-test.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # 2.9 is the first release that supports signed feeds
    # (SURequireSignedFeed below).
    exactVersion: "2.10.1"
  SwiftCertificates:
    url: https://github.com/apple/swift-certificates
    exactVersion: "1.21.1"
  SwiftASN1:
    url: https://github.com/apple/swift-asn1
    exactVersion: "1.7.3"
  # Not linked directly: pins swift-certificates' own dependency.
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto
    exactVersion: "5.0.3"
schemes:
  OpenSidecarMac:
    build:
      targets:
        OpenSidecarMac: all
    test:
      targets:
        - OpenSidecarMacTests
  OpenSidecarMacReceiver:
    build:
      targets:
        OpenSidecarMacReceiver: all
# DEVELOPMENT_TEAM comes from the environment (see generate.sh / .env) so no
# personal team ID lives in the repo. Unset = unsigned, fine for CI.
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6"
    # Lets Xcode auto-extract new user-facing strings into each target's
    # Localizable.xcstrings on every build, so the String Catalog stays in
    # sync with the source without a manual export step.
    SWIFT_EMIT_LOC_STRINGS: YES
    # Version defaults for local builds. CI overrides both via xcargs:
    # MARKETING_VERSION from the release tag, CURRENT_PROJECT_VERSION from
    # the GitHub Actions run number (monotonic, keeps CI builds unique).
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OpenSidecarMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      # The simplified-Chinese .strings tables live in apps/macos/zh-Hans.lproj.
      # Xcode cannot compile a same-named .xcstrings and .strings table into
      # one target, so keep the English editing catalogs as source documents
      # but ship the explicit Chinese tables (source English remains the key).
      - path: apps/macos
        excludes:
          - "*.xcstrings"
      - packages/shared
      # The unified app's "Use This Mac as a Display" role: the Mac
      # Receiver's code, minus its own app entry point and bundle resources
      # (ExtendPad keeps one icon, string catalog and Info.plist). The
      # standalone receiver target below still builds all of it for macOS
      # 12-13.
      - path: apps/macos-receiver
        excludes:
          - OpenSidecarMacReceiverApp.swift
          - Info.plist
          - "*.entitlements"
          - "*.xcstrings"
          - Assets.xcassets
    dependencies:
      - package: Sparkle
      - package: SwiftCertificates
        product: X509
      - package: SwiftASN1
        product: SwiftASN1
    info:
      path: apps/macos/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSLocalNetworkUsageDescription: ExtendPad connects to your Android device or other Mac over your Wi-Fi network.
        NSBonjourServices: ["_opensidecar._tcp", "_meowdisp-q._udp", "_opendisplay-pair._tcp", "_opendisplay-mac-pair._tcp"]
        LSApplicationCategoryType: public.app-category.utilities
        # The receiver role keeps its own identity and pins (see
        # ReceiverRoleConfiguration / TrustStore.receiverRole).
        MeowDisplayReceiverRoleTrust: separate
        # ExtendPad does not configure Sparkle until it has its own update
        # feed and EdDSA signing key. Upstream MeowDisplay feed URLs and keys
        # must never be reused: bundle identity alone is not an update policy.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.extendpad.mac
        PRODUCT_NAME: ExtendPad
        BUNDLE_DISPLAY_NAME: ExtendPad
        SWIFT_OBJC_BRIDGING_HEADER: apps/macos/OpenSidecarMac-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: apps/macos/OpenSidecarMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Local dev builds get their own identity: TCC keys permission
        # grants by bundle ID + code signature, so a Debug build sharing
        # the release bundle ID knocks out the release app's Screen
        # Recording/Accessibility grants every time the binary changes.
        # PRODUCT_NAME (not BUNDLE_DISPLAY_NAME) is what the permission
        # lists show, so the Debug build must override it to appear as its
        # own row instead of a second, indistinguishable "ExtendPad".
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.extendpad.mac.debug
          PRODUCT_NAME: ExtendPad Dev
          BUNDLE_DISPLAY_NAME: ExtendPad Dev
          # No debug-dylib stub: with it every Debug build's main executable is the same tiny
          # stub with one fixed UUID, and macOS Local Network privacy keys its grants by the
          # main executable's UUID (TN3179). A shared, unchanging UUID left the grant unmatched,
          # so outgoing connections to devices failed silently ("Local network prohibited").
          ENABLE_DEBUG_DYLIB: NO
          # Grayscale icon (same composition as Release) so the dev build is
          # obvious in the Dock, cmd-tab and permission lists.
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
  # The standalone receiver app (issues #82/#17/#241): a spare Mac as a
  # display. Deliberately its own bundle with a much lower deployment target
  # than the sender, which is pinned to 14 by its capture stack. Everything
  # under packages/shared/ and the files listed from apps/macos/ must therefore compile at
  # this floor; keep this the oldest macOS the receiver path supports.
  OpenSidecarMacReceiver:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - apps/macos-receiver
      - packages/shared
      - apps/macos/Log.swift
      - apps/macos/LogPolicies.swift
      - apps/macos/CheckForUpdatesView.swift
      - apps/macos/NativeSearchField.swift
    dependencies:
      - package: Sparkle
      - package: SwiftCertificates
        product: X509
      - package: SwiftASN1
        product: SwiftASN1
    info:
      path: apps/macos-receiver/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: ExtendPad Receiver advertises itself on the local network so another Mac can connect and use this Mac as a display.
        NSBonjourServices: ["_opensidecar._tcp", "_meowdisp-q._udp", "_opendisplay-pair._tcp", "_opendisplay-mac-pair._tcp"]
        LSApplicationCategoryType: public.app-category.utilities
        # Sparkle remains disabled; see the sender target's comment above.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.extendpad.mac.receiver
        PRODUCT_NAME: ExtendPad Receiver
        BUNDLE_DISPLAY_NAME: ExtendPad Receiver
        # Log.swift's file locking helpers live in the C bridging header.
        SWIFT_OBJC_BRIDGING_HEADER: apps/macos/OpenSidecarMac-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: apps/macos-receiver/OpenSidecarMacReceiver.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.extendpad.mac.receiver.debug
          PRODUCT_NAME: ExtendPad Receiver Dev
          BUNDLE_DISPLAY_NAME: ExtendPad Receiver Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
  OpenSidecarMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
